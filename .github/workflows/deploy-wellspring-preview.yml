name: Publish Wellspring Preview

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-wellspring-preview.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: wellspring-preview-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: https://bcshinstudio.github.io/element-forge/wellspring-preview/game/
    steps:
      - name: Checkout exactly the QA-verified Wellspring feature revision
        uses: actions/checkout@v4
        with:
          ref: e3460f32a0cce5c8a6083ca7084359e8daacc3f8
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify puzzle and editor regression tests
        run: |
          node --test map-editor/tests/*.test.js game/tests/*.test.js
          node --check game/app.js
      - name: Build standalone 108-stage HTML for GitHub Pages preview only
        run: |
          python3 game/build.py Wellspring_Pause_Menu_Preview.html
          mkdir -p _site/wellspring-preview/game
          cp Wellspring_Pause_Menu_Preview.html _site/wellspring-preview/game/index.html
          touch _site/.nojekyll
          test -s _site/wellspring-preview/game/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload preview build to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Wellspring preview
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify published preview on the exact requested URL
        run: |
          python3 - <<'PY'
          import time,urllib.request
          url="https://bcshinstudio.github.io/element-forge/wellspring-preview/game/"
          for attempt in range(12):
              try:
                  with urllib.request.urlopen(url+"?stage-menu-preview="+str(attempt),timeout=12) as response:
                      html=response.read().decode("utf-8")
                  if all(fragment in html for fragment in ('class="pause-menu-header"','id="menu-lessons-back"','confluence-forges-108')):
                      print("PASS: live Wellspring preview serves the polished menu and 108 stages")
                      break
              except Exception as error:
                  print("Retry",attempt+1,type(error).__name__,str(error)[:120])
              time.sleep(3)
          else:
              raise SystemExit("Unable to verify the new preview at the requested URL")
          PY
