
name: Map Editor CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: map-editor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run regression tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run game regression tests and syntax checks
        working-directory: .
        run: |
          node --test game/tests/*.test.js
          node --check game/app.js
          node --check game/session.js
          node --check game/levels.js
          node --check game/progress.js

      - name: Install Playwright
        run: python -m pip install playwright==1.51.0

      - name: Run editor and game browser integration tests
        working-directory: .
        run: |
          if command -v google-chrome >/dev/null; then
            export CHROMIUM_EXECUTABLE="$(command -v google-chrome)"
          else
            python -m playwright install --with-deps chromium
            export CHROMIUM_EXECUTABLE="$(python -c 'from playwright.sync_api import sync_playwright; p = sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          fi
          python map-editor/tests/browser_smoke.py
          python game/tests/browser_smoke.py
          python game/build.py Wellspring.html
          python game/build.py --editor Wellspring_Map_Editor.html
          python game/tests/artwork_browser.py
