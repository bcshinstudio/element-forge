<!doctype html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <meta name="theme-color" content="#102019">
 <title>Element Forge · G1</title>
 <link rel="stylesheet" href="styles.css">
 <script defer src="../map-editor/engine.js"></script>
 <script defer src="../map-editor/map-format.js"></script>
 <script defer src="levels.js"></script>
 <script defer src="session.js"></script>
 <script defer src="app.js"></script>
</head>
<body>
 <header class="masthead">
  <a href="./index.html" class="brand">Element Forge</a>
  <label for="level">Puzzle
   <select id="level"></select>
  </label>
 </header>
 <main class="layout">
  <section class="field" aria-labelledby="puzzle">
   <h1 id="puzzle"></h1>
   <p id="description"></p>
   <div id="board" role="group" aria-label="Puzzle board"></div>
   <div id="elements" class="legend"></div>
  </section>
  <section class="controls" aria-labelledby="phase">
   <h2 id="phase">Plan your route</h2>
   <p id="instructions"></p>
   <form id="plan">
    <div id="loadout"></div>
    <p id="budget"></p>
    <button class="primary" id="start">Start building</button>
   </form>
   <div id="build" hidden>
    <div id="tools" class="tools"></div>
    <label id="link-field" hidden>Link ID <input id="link-id" value="A" maxlength="12"></label>
    <div class="actions">
     <button id="undo">Undo</button><button id="restart">Restart</button><button id="replan">Replan tools</button>
    </div>
    <button id="check" class="primary">Test delivery</button>
   </div>
   <div id="finish" hidden>
    <p id="score"></p>
    <div class="actions"><button id="replay">Replay puzzle</button><button id="next" class="primary">Next puzzle</button></div>
   </div>
   <p id="status" role="status" aria-live="polite"></p>
   <label class="import">Try an editor-exported level <input type="file" id="import" accept=".json,application/json"></label>
  </section>
 </main>
 <footer>BC Shin Studio</footer>
</body>
</html>
